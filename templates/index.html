<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Sentiment Analyzer</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="background"></div>

<div class="container main-container">
    <div class="row glass-card">

        <!-- LEFT PANEL -->
        <div class="col-md-5 left-panel">
            <h1>🤖 AI Sentiment</h1>
            <p class="tagline">
                Analyze emotions from text using Machine Learning
            </p>

            <ul class="features">
                <li><i class="fa-solid fa-brain"></i> NLP Powered</li>
                <li><i class="fa-solid fa-chart-line"></i> Confidence Score</li>
                <li><i class="fa-solid fa-bolt"></i> Real-time Prediction</li>
            </ul>
        </div>

        <!-- RIGHT PANEL -->
        <div class="col-md-7 right-panel">

            <form method="POST" onsubmit="showLoader()">

                <label class="input-label">📝 Enter Review</label>

                <textarea
                    name="review"
                    id="reviewText"
                    rows="6"
                    maxlength="500"
                    oninput="countChars()"
                    placeholder="Type something like: This product exceeded my expectations!"
                    required>{{ review_text }}</textarea>

                <div class="char-counter">
                    Characters: <span id="charCount">0</span>/500
                </div>

                <button type="submit" class="analyze-btn">
                    <i class="fa-solid fa-magnifying-glass"></i> Analyze
                </button>
            </form>

            <!-- LOADER -->
            <div id="loader" class="loader hidden"></div>

            <!-- ERROR MESSAGE -->
            {% if error_message %}
            <div class="alert alert-danger mt-3">
                {{ error_message }}
            </div>
            {% endif %}

            <!-- RESULT CARD -->
            {% if sentiment_label %}
            <div class="result-card
                {% if 'Positive' in sentiment_label %}
                    positive
                {% elif 'Neutral' in sentiment_label %}
                    neutral
                {% else %}
                    negative
                {% endif %}
            ">
                <h4>✨ Prediction Result</h4>

                <div class="result-text">
                    {{ sentiment_label }}
                </div>

                <div class="confidence-wrapper">
                    <div class="confidence-label">
                        Confidence: <span id="confidenceValue">0</span>%
                    </div>

                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill"
                             data-confidence="{{ confidence }}">
                        </div>
                    </div>
                </div>
            </div>
            {% endif %}

        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
